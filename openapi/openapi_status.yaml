  /v1/:
    get:
      summary: Returns a list of all routes in the main route that are collection
      tags: []
      parameters:
      - name: filters
        description: 'the filters to apply when filtering the routes (Is not

          implemented now)

          '
        schema:
          type: string
        in: query
      - name: order_by
        description: 'fields to order the routes by (Is not implemented

          now)

          '
        schema:
          type: string
        in: query
      responses:
        '200':
          description: Get nested urls
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        default:
          $ref: '#/components/responses/Error'
      operationId: Filter_v1
  /v1/agents/:
    post:
      summary: Create the agent, always starting it ACTIVE.
      tags:
