                items:
                  type: string
        default:
          $ref: '#/components/responses/Error'
      operationId: Get_urls
  /specifications/:
    get:
      summary: Get OpenApiSpecificationRoute OpenApiSpecificationControllers
      tags: []
      parameters: []
      responses:
        '200':
          description: Get nested urls
          content:
            application/json:
              schema:
