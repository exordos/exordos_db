  /v1/types/postgres/versions/:
    get:
      summary: Get PGVersions
      tags:
      - PGVersion
      parameters:
      - name: q
        in: query
        required: false
        description: "Filter expression (a subset of AIP-160). Combines with the field\n\
          parameters, which stay the typed way to ask for equality.\n\n    name =\
          \ \"vm1\" AND size > 10\n    tags:\"env:prod\" OR tags:\"env:staging\"\n\
          \    NOT (state = error) AND created_at >= \"2026-07-01T00:00:00Z\"\n\n\
          Operators: `=` `!=` `<` `<=` `>` `>=`, `:` (an array holds the element,\n\
          or with `*` that the field is set), `AND` `OR` `NOT`, parentheses.\nThe\
          \ keywords are uppercase, and `OR` binds tighter than `AND`. Values\ncarrying\
          \ `:`, `.` or spaces must be quoted."
        schema:
          type: string
        example: name = "vm1"
        x-ra-filter-fields:
        - created_at
        - description
        - image
        - name
        - updated_at
        - uuid
      - $ref: '#/components/parameters/PGVersion_uuid'
      - $ref: '#/components/parameters/PGVersion_name'
      - $ref: '#/components/parameters/PGVersion_description'
      - $ref: '#/components/parameters/PGVersion_created_at'
      - $ref: '#/components/parameters/PGVersion_updated_at'
      - $ref: '#/components/parameters/PGVersion_image'
      responses:
        '200':
          description: PGVersion_Filter
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PGVersion_Filter'
        default:
          $ref: '#/components/responses/Error'
      operationId: Filter_v1_types_postgres_versions
    post:
      summary: Create PGVersion
      tags:
      - PGVersion
      parameters: []
      responses:
        '201':
          description: PGVersion_Create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PGVersion_Create'
        default:
