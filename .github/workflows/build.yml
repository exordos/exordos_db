name: build

on:
  push:
    branches-ignore:
      - master
    tags:
      - '*'

jobs:
  Build:
    runs-on: [ self-hosted, vm ]
    if: ${{ github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: true
    outputs:
      version: ${{ steps.build_element.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Element
        id: build_element
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          set -eux

          VERSION="$(exordos get-version .)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          exordos build $(pwd)

          # Decode and write the push configuration
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest
  # communal_pg_cluster is built alongside dbaas with the same version: a PG
  # instance ordered through dbaas, so installing it runs the control plane
  # and the data plane both, and the check waits for that instance.
  Test:
    needs: Build
    uses: exordos/exordos_tests/.github/workflows/element_realm_test.yml@realm_ssh_input
    with:
      elements: dbaas communal_pg_cluster
      version: ${{ needs.Build.outputs.version }}
      element-timeout: 600
      overbook: true
      check-script: .github/scripts/check-communal-pg-cluster.sh
      tests-ref: realm_ssh_input
    secrets: inherit
