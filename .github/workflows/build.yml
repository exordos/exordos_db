name: build

on:
  push:

env:
  # Space-separated list of elements to install as dependencies
  ELEMENT_DEPS: ""
  ELEMENT_NAME: dbaas
  # Built alongside dbaas with the same version: a PG instance ordered through
  # dbaas, so installing it runs the control plane and the data plane both.
  CLUSTER_ELEMENT_NAME: communal_pg_cluster
  CLUSTER_INSTANCE_NAME: communal-pg-cluster

jobs:
  Build:
    runs-on: [ self-hosted, vm ]
    if: ${{ github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: true
    outputs:
      dbaas_version: ${{ steps.build_element.outputs.dbaas_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Element
        id: build_element
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          set -eux

          VERSION="$(exordos get-version .)"
          echo "dbaas_version=${VERSION}" >> $GITHUB_OUTPUT

          exordos build $(pwd)

          # Decode and write the push configuration
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest
  Test:
    runs-on: ubuntu-24.04
    needs: Build
    if : ${{ github.actor != 'dependabot[bot]' }}
    env:
      DBAAS_VERSION: ${{ needs.Build.outputs.dbaas_version }}
      # Only this job talks to the realm pool: the Build job on the
      # self-hosted runner has no use for the credentials.
      PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
      USERNAME: ${{ secrets.TEST_USERNAME }}
      USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      ENDPOINT: https://exordos.com/api/core
      REALM_TTL_HOURS: "2"
    steps:
      - name: Install exordos
        run: curl -fsSL https://repo.exordos.com/install.sh | sh
      - name: Checkout the realm scripts
        uses: actions/checkout@v7
        with:
          repository: exordos/exordos_tests
          path: exordos_tests
      - name: get_realm
        timeout-minutes: 15
        working-directory: exordos_tests
        run: |
          set -euo pipefail

          REALM_NAME="dbaas-build-${{ github.run_id }}"
          echo "REALM_NAME=$REALM_NAME" >> "$GITHUB_ENV"

          got="$(.github/scripts/get-realm.sh "$REALM_NAME" "$REALM_TTL_HOURS")"

          echo "::add-mask::$(echo "$got" | sed -n 's/^ADMIN_PASSWORD=//p')"
          echo "$got" >> "$GITHUB_ENV"
          echo "$got" | grep -v '^ADMIN_PASSWORD='
      - name: wait_for_realm_api
        timeout-minutes: 10
        run: |
          set -uo pipefail

          for i in $(seq 1 60); do
              for scheme in https http; do
                  url="$scheme://$REALM_DOMAIN/api/core"
                  if exordos --endpoint "$url" --user admin \
                             --password "$ADMIN_PASSWORD" \
                             ready_api > /dev/null 2>&1; then
                      echo "REALM_CORE_URL=$url" >> "$GITHUB_ENV"
                      echo "The realm's core answered at $url"
                      exit 0
                  fi
              done
              echo "Waiting for the realm's core api... ($i/60)"
              sleep 5
          done

          echo "The realm's core answered on neither https nor http at" >&2
          echo "$REALM_DOMAIN" >&2
          exit 1
      - name: point_cli_at_the_realm
        run: |
          set -euo pipefail

          exordos settings set-realm default --endpoint "$REALM_CORE_URL"
          exordos settings set-context default --name default \
              --user admin --password "$ADMIN_PASSWORD"
      - name: wait_for_pushed_version
        timeout-minutes: 10
        run: |
          set -uo pipefail

          # The realm's repositories sync lazily, so the version pushed by the
          # Build job is not in its catalog until a refresh picks it up.
          # Refresh on every round: the push may still be reaching the repo's
          # mirror.
          pending="$ELEMENT_NAME $CLUSTER_ELEMENT_NAME"
          for i in $(seq 1 60); do
              exordos repo refresh || true
              still=""
              for name in $pending; do
                  status="$(exordos repo e l --dev -f "name=$name" -o json \
                      2>/dev/null | jq -r --arg v "$DBAAS_VERSION" \
                      '[.[] | select(.version == $v) | .status] | first // ""' \
                      2>/dev/null || true)"
                  if [ "$status" = "AVAILABLE" ]; then
                      echo "$name $DBAAS_VERSION is available in the realm"
                  else
                      echo "Waiting for $name $DBAAS_VERSION... (${status:-not listed}, $i/60)"
                      still="$still $name"
                  fi
              done
              pending="$still"
              if [ -z "$pending" ]; then
                  exit 0
              fi
              sleep 10
          done

          echo "Never became available in the realm:$pending" >&2
          exordos repo l >&2 || true
          for name in $pending; do
              exordos repo e l --dev -f "name=$name" >&2 || true
          done
          exit 1
      - name: Preload dependencies in background
        run: |
          for dep in $ELEMENT_DEPS; do
            exordos e elements install $dep
          done
      - name: install dbaas
        run: |
          set -eux

          exordos e e install "$ELEMENT_NAME" -v "$DBAAS_VERSION"
      - name: check exordos dbaas
        timeout-minutes: 10
        run: |
          set -eux

          exordos_tests/.github/scripts/wait-for-element.sh "$ELEMENT_NAME" 540

          installed="$(exordos ee l -o json -f "name=$ELEMENT_NAME" | jq -r '.[0].version')"
          if [ "$installed" != "$DBAAS_VERSION" ]; then
              echo "Installed $installed instead of $DBAAS_VERSION" >&2
              exit 1
          fi

          exordos e e show "$ELEMENT_NAME"
      - name: install communal_pg_cluster
        run: |
          set -eux

          exordos e e install "$CLUSTER_ELEMENT_NAME" -v "$DBAAS_VERSION"
      - name: check communal_pg_cluster
        timeout-minutes: 20
        run: |
          set -eux

          exordos_tests/.github/scripts/wait-for-element.sh "$CLUSTER_ELEMENT_NAME" 1140

          installed="$(exordos ee l -o json -f "name=$CLUSTER_ELEMENT_NAME" | jq -r '.[0].version')"
          if [ "$installed" != "$DBAAS_VERSION" ]; then
              echo "Installed $installed instead of $DBAAS_VERSION" >&2
              exit 1
          fi

          exordos e e show "$CLUSTER_ELEMENT_NAME"
      - name: check the pg instance
        timeout-minutes: 15
        run: |
          set -uo pipefail

          # dbaas' own view of the instance the element ordered: its status
          # follows the node set that runs postgres, so ACTIVE means the data
          # plane nodes came up, not only that dbaas accepted the resource.
          for i in $(seq 1 90); do
              status="$(exordos dbaas i l -f "name=$CLUSTER_INSTANCE_NAME" -o json \
                  2>/dev/null | jq -r '.[0].status // ""' 2>/dev/null || true)"
              case "$status" in
                  ACTIVE)
                      echo "PG instance $CLUSTER_INSTANCE_NAME is ACTIVE"
                      exordos dbaas i l
                      exit 0
                      ;;
                  ERROR)
                      echo "PG instance $CLUSTER_INSTANCE_NAME went ERROR" >&2
                      exordos dbaas i l >&2 || true
                      exit 1
                      ;;
              esac
              echo "Waiting for PG instance $CLUSTER_INSTANCE_NAME... (${status:-not listed}, $i/90)"
              sleep 10
          done

          echo "PG instance $CLUSTER_INSTANCE_NAME never became ACTIVE" >&2
          exordos dbaas i l >&2 || true
          exit 1
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 15
      - name: delete_realm
        if: ${{ always() }}
        run: |
          set -eux

          # Fall back to the name: an ordered realm that never came up leaves
          # get-realm.sh without printing its uuid, and it has no TTL.
          realm="${REALM_UUID:-${REALM_NAME:-}}"
          if [ -z "$realm" ]; then
              echo "No realm was claimed, nothing to delete"
              exit 0
          fi
          exordos --endpoint "$ENDPOINT" --project-id "$PROJECT_ID" \
              --user "$USERNAME" --password "$USER_PASSWORD" \
              realms delete "$realm"
