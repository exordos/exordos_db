name: build

on:
  push:

env:
  # Space-separated list of elements to install as dependencies
  ELEMENT_DEPS: ""
  PACKER_VERSION: "1.9.2"
  CORE_ENDPOINT_URL: http://10.20.0.2:80/api/core
  CORE_USERNAME: "admin"
  CORE_PASSWORD: "admin"
  ELEMENT_NAME: dbaas

jobs:
  Build:
    runs-on: [ self-hosted, vm ]
    if: ${{ github.actor != 'dependabot[bot]' }}
    strategy:
      fail-fast: true
    outputs:
      dbaas_version: ${{ steps.build_element.outputs.dbaas_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Element
        id: build_element
        env:
          PUSH_CFG: ${{ secrets.PUSH_CFG }}
        run: |
          set -eux

          VERSION="$(exordos get-version .)"
          echo "dbaas_version=${VERSION}" >> $GITHUB_OUTPUT
          
          exordos build $(pwd)

          # Decode and write the push configuration
          echo "$PUSH_CFG" | base64 -d > exordos/exordos.push.yaml
          exordos push -c exordos/exordos.push.yaml -t local -f --latest
  Test:
    runs-on: ubuntu-24.04
    needs: Build
    if : ${{ github.actor != 'dependabot[bot]' }}
    env:
      DBAAS_VERSION: ${{ needs.Build.outputs.dbaas_version }}
    steps:
      - name: Setup `packer`
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}
      - name: Install exordos
        run: curl -fsSL https://repo.exordos.com/install.sh | sudo sh
      - name: Install hypervisor
        run: |
          set -eux

          # Prefetch the core artifacts into ~/.cache/exordos while the
          # hypervisor packages are being installed: both steps are
          # independent and each takes around half a minute.
          exordos bootstrap -i latest -m core --download-only > prefetch.log 2>&1 &
          PREFETCH_PID=$!

          sudo exordos compute hypervisors init --connection-uri qemu+tcp://10.20.0.1/system
          sudo chmod 666 /dev/kvm
          
          wait $PREFETCH_PID || { cat prefetch.log; exit 1; }
          cat prefetch.log
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set exordos config
        run: |
          exordos settings set-realm default --endpoint $CORE_ENDPOINT_URL
          exordos settings set-context default --name default --user $CORE_USERNAME --password $CORE_PASSWORD
      - name: Bootstrap exordos_core
        run:
          exordos bootstrap -i latest -f -m core --admin-password $CORE_PASSWORD --cidr 10.20.0.0/22
      - name: Wait for Exordos Core API
        run: |
          set -eux
          
          for i in {1..60}; do
            if exordos ready_api; then
              echo "Exordos Core API is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Exordos Core API did not become ready"
              exit 1
            fi
            echo "Waiting for Exordos Core API... ($i/60)"
            sleep 2
          done
          
          while [ $(exordos ee l -o json -f name=core | jq -r .[0]."status") != "ACTIVE" ]; do
            sleep 2
          done
      - name: Set hypervisor with overbooking
        run: |
          HYPER_UUID="$(exordos c h l -o json | jq -r .[0]."uuid")"
          exordos compute hypervisors update $HYPER_UUID --cores-ratio 10.0 --ram-ratio 10.0
      - name: Preload dependencies in background
        run: |
          for dep in $ELEMENT_DEPS; do
            exordos e elements install $dep
          done
      - name: install dbaas
        run: |
          exordos e e install $ELEMENT_NAME -v $DBAAS_VERSION
      - name: check exordos dbaas
        timeout-minutes: 10
        run: |
          set -eux

          while [ $(exordos ee l -o json -f name=$ELEMENT_NAME | jq -r .[0]."status") != "ACTIVE" ]; do
            sleep 5
          done

          exordos e e show $ELEMENT_NAME
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 15
