name: build

on:
  push:
    branches-ignore:
      - master
    tags:
      - '*'

jobs:
  Build:
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: exordos/exordos_ci/.github/workflows/element_build.yml@master
    secrets:
      PUSH_CFG: ${{ secrets.PUSH_CFG }}
  # communal_pg_cluster is built alongside dbaas with the same version: a PG
  # instance ordered through dbaas, so installing it runs the control plane
  # and the data plane both, and the check waits for that instance.
  Test:
    needs: Build
    uses: exordos/exordos_ci/.github/workflows/element_realm_test.yml@master
    with:
      elements: dbaas communal_pg_cluster
      version: ${{ needs.Build.outputs.version }}
      element-timeout: 600
      overbook: true
      check-script: .github/scripts/check-communal-pg-cluster.sh
    secrets: inherit
