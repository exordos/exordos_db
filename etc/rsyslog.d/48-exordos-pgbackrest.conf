# The log files of pgBackRest (archive-push-async, backups, checks) go to
# VictoriaLogs like journald does, through the vlagent the base image
# forwards syslog to. A ruleset of their own keeps them out of
# /var/log/syslog, and its queue keeps an unreachable vlagent from holding
# up the rest of the logging.
module(load="imfile")

input(type="imfile"
      File="/var/log/pgbackrest/*.log"
      Tag="pgbackrest:"
      Facility="local0"
      Severity="info"
      reopenOnTruncate="on"
      Ruleset="exordos-pgbackrest")

ruleset(name="exordos-pgbackrest") {
    action(type="omfwd"
           Target="127.0.0.1"
           Port="9514"
           Protocol="tcp"
           Template="RSYSLOG_SyslogProtocol23Format"
           queue.type="LinkedList"
           queue.size="10000"
           action.resumeRetryCount="-1")
}
